name: CI/CD Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: CI (install & cek sintaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependency
        run: npm ci

      - name: Cek sintaks semua file JS
        run: |
          find . -name "*.js" -not -path "./node_modules/*" -print0 \
            | xargs -0 -n1 node --check

  deploy:
    name: CD (deploy lewat self-hosted runner)
    needs: ci
    # deploy hanya saat push / manual ke main, bukan saat pull request
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    # cegah 2 deploy berjalan bersamaan
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    env:
      # Atur di GitHub: Settings > Secrets and variables > Actions > Variables
      APP_DIR: ${{ vars.APP_DIR }}
      PM2_NAME: ${{ vars.PM2_NAME || 'mysmk-be' }}
    steps:
      - name: Pastikan APP_DIR diisi
        run: |
          if [ -z "$APP_DIR" ]; then
            echo "::error::Variable APP_DIR belum diisi (folder aplikasi di server, mis. /home/student/node-mysmk-be)"
            exit 1
          fi

      - name: Tarik kode terbaru
        working-directory: ${{ vars.APP_DIR }}
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

      - name: Install dependency (production)
        working-directory: ${{ vars.APP_DIR }}
        run: npm ci --omit=dev

      - name: Jalankan migrasi database
        working-directory: ${{ vars.APP_DIR }}
        run: |
          # pakai environment DB yang sama dengan aplikasi (APP_ENV di .env server)
          DB_ENV=$(node -e 'require("dotenv").config(); process.stdout.write(process.env.APP_ENV || "")')
          if [ -z "$DB_ENV" ]; then
            echo "::error::APP_ENV tidak ditemukan di .env server"
            exit 1
          fi
          npx sequelize-cli db:migrate --env "$DB_ENV"

      - name: Restart aplikasi (PM2)
        working-directory: ${{ vars.APP_DIR }}
        run: |
          if pm2 describe "$PM2_NAME" > /dev/null 2>&1; then
            pm2 reload "$PM2_NAME" --update-env
          else
            pm2 start index.js --name "$PM2_NAME"
          fi
          pm2 save
