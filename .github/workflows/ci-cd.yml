name: CI/CD Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: CI (install & cek sintaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependency
        run: npm ci

      - name: Cek sintaks semua file JS
        run: |
          find . -name "*.js" -not -path "./node_modules/*" -print0 \
            | xargs -0 -n1 node --check

  deploy:
    name: CD (docker compose lewat self-hosted runner)
    needs: ci
    # deploy hanya saat push / manual ke main, bukan saat pull request
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    # cegah 2 deploy berjalan bersamaan
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    env:
      # Atur di GitHub: Settings > Secrets and variables > Actions > Variables
      # folder clone repo backend di server (berisi .env & docker-compose.yml)
      APP_DIR: ${{ vars.APP_DIR }}
    steps:
      - name: Pastikan APP_DIR & .env ada
        run: |
          if [ -z "$APP_DIR" ]; then
            echo "::error::Variable APP_DIR belum diisi (folder repo backend di server, mis. /home/student/node-mysmk-be)"
            exit 1
          fi
          if [ ! -f "$APP_DIR/.env" ]; then echo "::error::$APP_DIR/.env tidak ditemukan"; exit 1; fi

      - name: Tarik kode terbaru
        working-directory: ${{ vars.APP_DIR }}
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

      - name: Build & jalankan container
        working-directory: ${{ vars.APP_DIR }}
        run: docker compose up -d --build --remove-orphans

      - name: Jalankan migrasi database
        working-directory: ${{ vars.APP_DIR }}
        run: |
          # pakai environment DB yang sama dengan aplikasi (APP_ENV di .env server)
          docker compose exec -T api sh -c '
            DB_ENV=$(node -p "require(\"dotenv\").config(); process.env.APP_ENV || \"\"")
            if [ -z "$DB_ENV" ]; then echo "APP_ENV tidak ditemukan di .env"; exit 1; fi
            npx sequelize-cli db:migrate --env "$DB_ENV"
          '

      - name: Cek container berjalan
        working-directory: ${{ vars.APP_DIR }}
        run: |
          sleep 5
          docker compose ps
          if [ "$(docker inspect -f '{{.State.Running}}' mysmk-api)" != "true" ]; then
            docker compose logs --tail=100 api
            echo "::error::Container mysmk-api tidak berjalan"
            exit 1
          fi

      - name: Bersihkan image lama
        run: docker image prune -f
