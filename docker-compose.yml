# Backend MySMK. Jalankan di VPS dari folder repo ini:
#   docker compose up -d --build
# Apache meneruskan https://api.../ ke 127.0.0.1:8080 (lihat konfigurasi reverse proxy).
services:
  api:
    build: .
    container_name: mysmk-api
    restart: unless-stopped
    # sama dengan container lama: file upload di volume dimiliki uid 1001
    user: "1001:1001"
    environment:
      TZ: Asia/Jakarta
      PORT: 8080
    # .env tidak dimasukkan ke image; dibaca dotenv langsung dari file di server
    volumes:
      - ./.env:/app/.env:ro
      # file upload (bukti, foto, excel, dll): volume Docker yang SAMA dengan deploy lama
      - mysmk_uploads:/app/public/data/uploads
    # sama dengan deploy lama (API diakses langsung di port 8080).
    # Setelah API lewat Apache + HTTPS, ganti jadi "127.0.0.1:8080:8080".
    ports:
      - "8080:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Backup database harian (mysqldump) -> ./backups di VPS (+ opsional salinan di luar VPS via rclone).
  # Backup manual sekarang : docker compose run --rm backup /backup.sh
  # Lihat log backup        : docker compose logs -f backup
  backup:
    build: ./backup
    container_name: mysmk-backup
    restart: unless-stopped
    environment:
      TZ: Asia/Jakarta
      BACKUP_CRON: "0 2 * * *"        # setiap hari 02:00 WIB
      BACKUP_KEEP_DAYS: "14"          # simpan 14 hari di VPS
      # Salinan di luar VPS (opsional). Contoh: "gdrive:backup-mysmk" atau "s3:nama-bucket/mysmk".
      # Buat remote dulu: docker compose run --rm backup rclone config --config /config/rclone/rclone.conf
      BACKUP_RCLONE_REMOTE: ""
      BACKUP_REMOTE_KEEP_DAYS: "60"
    volumes:
      - ./.env:/app/.env:ro
      - ./backups:/backups
      - ./backup/rclone:/config/rclone
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  # Volume upload yang dibuat deploy lama (compose di ~/node-mysmk-be, proyek "node-mysmk-be").
  # Nama bisa diganti lewat UPLOADS_VOLUME bila hasil `docker volume ls` berbeda.
  mysmk_uploads:
    name: ${UPLOADS_VOLUME:-node-mysmk-be_mysmk_uploads}
